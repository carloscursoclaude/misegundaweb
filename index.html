<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Web en mantenimiento</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #f59e0b; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at top, #1e3a8a 0%, var(--bg) 60%);
      color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 480px; width: 100%; text-align: center; padding: 48px 32px;
      background: var(--card); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    .icon { font-size: 64px; display: inline-block; animation: spin 4s linear infinite; }
    h1 { margin: 20px 0 12px; font-size: 1.9rem; }
    p { color: var(--muted); line-height: 1.6; }
    .bar { height: 6px; background: #334155; border-radius: 99px; overflow: hidden; margin: 28px 0 0; }
    .bar span { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 99px; animation: load 1.8s ease-in-out infinite; }
    a { color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">⚙️</div>
    <h1>Web en mantenimiento</h1>
    <p>Estamos realizando mejoras para ofrecerte una mejor experiencia. Volveremos muy pronto.</p>
    <p style="margin-top:12px">Gracias por tu paciencia.</p>
    <div class="bar"><span></span></div>
  </main>
</body>
</html>
